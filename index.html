<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>🔔 SP-QUIZ Buzzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b0c10; --card-bg: rgba(18, 20, 43, 0.7);
        --text: #e0e6f0; --active: #00ffd0; --passive: #ff33ff;
        --accent: #7f00ff; --gold: #ffd700; --danger: #ff3c3c; --neon: #0ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
        margin: 0; font-family: 'Poppins', sans-serif;
        background-color: var(--bg); color: var(--text);
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        position: relative; padding: 20px;
    }
    .bg-orbs { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4; animation: float 20s infinite alternate ease-in-out; }
    .orb:nth-child(1) { width: 300px; height: 300px; background: var(--accent); top: -80px; left: -80px; }
    .orb:nth-child(2) { width: 250px; height: 250px; background: var(--active); bottom: -50px; right: -50px; animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(60px, 40px) scale(1.2); } }

    header { font-size: 26px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;
        background: linear-gradient(90deg, #00ffd0, #7f00ff, #ff33ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }

    #conn-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--danger); margin-left: 6px; vertical-align: middle; }
    #conn-dot.online { background: var(--active); box-shadow: 0 0 8px var(--active); }
    #conn-label { font-size: 12px; color: #888; margin-bottom: 25px; }

    .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
        padding: 30px; width: 100%; max-width: 380px; text-align: center; backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    input {
        width: 100%; padding: 14px; font-size: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05); color: white; text-align: center; margin: 15px 0; font-family: 'Poppins', sans-serif;
    }
    input:focus { outline: none; border-color: var(--active); }

    button.primary {
        width: 100%; padding: 16px; font-size: 18px; font-weight: 800; border-radius: 12px; border: none;
        background: var(--accent); color: white; cursor: pointer; font-family: 'Poppins', sans-serif;
    }

    #status { font-size: 16px; font-weight: 600; min-height: 44px; margin-bottom: 20px; line-height: 1.4; transition: 0.3s; }

    #buzzBtn {
        width: 220px; height: 220px; border-radius: 50%; border: none; font-size: 60px;
        background: radial-gradient(circle at 35% 30%, #1affce, #00b894);
        box-shadow: 0 0 40px rgba(0,255,208,0.6), inset 0 -10px 20px rgba(0,0,0,0.2);
        cursor: pointer; transition: transform 0.1s ease, box-shadow 0.3s, background 0.3s;
        color: #012; font-family: 'Poppins', sans-serif; font-weight: 900;
    }
    #buzzBtn:active:not(:disabled) { transform: scale(0.93); }
    #buzzBtn:disabled { cursor: default; }
    #buzzBtn.waiting { background: radial-gradient(circle at 35% 30%, #444, #222); box-shadow: none; opacity: 0.6; }
    #buzzBtn.lost { background: radial-gradient(circle at 35% 30%, #ff6666, #b30000); box-shadow: 0 0 30px rgba(255,60,60,0.5); opacity: 0.7; }
    #buzzBtn.win { background: radial-gradient(circle at 35% 30%, #ffe680, var(--gold)); box-shadow: 0 0 50px rgba(255,215,0,0.8); animation: winPulse 0.8s infinite alternate; }
    @keyframes winPulse { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }

    #changeName { background: none; border: none; color: #888; font-size: 13px; margin-top: 20px; cursor: pointer; text-decoration: underline; font-family: 'Poppins', sans-serif; }
    #buzz-screen { display: none; }
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb"></div><div class="orb"></div></div>

<header>🔔 SP-QUIZ BUZZER</header>
<div id="conn-label">Verbindung <span id="conn-dot"></span></div>

<div class="card" id="name-screen">
    <h2 style="margin-top:0;">Wie heißt du?</h2>
    <input id="nameInput" placeholder="Dein Name" maxlength="20" autocomplete="off">
    <button class="primary" onclick="saveName()">Los geht's 🚀</button>
</div>

<div class="card" id="buzz-screen">
    <div id="status">Warte...</div>
    <button id="buzzBtn" onclick="pressBuzz()" disabled>🔔</button>
    <div><button id="changeName" onclick="changeName()">Namen ändern</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDOqgEZoRRyam3rbsELQjqw40o205_Tnmg",
    authDomain: "spquiz-17717.firebaseapp.com",
    databaseURL: "https://spquiz-17717-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spquiz-17717",
    storageBucket: "spquiz-17717.firebasestorage.app",
    messagingSenderId: "109769193780",
    appId: "1:109769193780:web:50e4a00439fc08cbbe8d61"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const buzzRef = ref(db, "buzz");
const winnerRef = ref(db, "buzz/winner");
const connRef = ref(db, ".info/connected");

let myName = localStorage.getItem("buzzerName") || "";
let lastData = {};

onValue(connRef, (snap) => {
    document.getElementById("conn-dot").classList.toggle("online", snap.val() === true);
});

function initScreen() {
    if (myName) {
        document.getElementById("name-screen").style.display = "none";
        document.getElementById("buzz-screen").style.display = "block";
    } else {
        document.getElementById("name-screen").style.display = "block";
        document.getElementById("buzz-screen").style.display = "none";
    }
}

window.saveName = function () {
    const val = document.getElementById("nameInput").value.trim();
    if (!val) return;
    myName = val;
    localStorage.setItem("buzzerName", myName);
    initScreen();
};

window.changeName = function () {
    localStorage.removeItem("buzzerName");
    myName = "";
    document.getElementById("nameInput").value = "";
    initScreen();
};

function renderState(data) {
    lastData = data;
    const open = !!data.open;
    const winner = data.winner || null;
    const rejected = data.rejected || {};
    const iAmRejected = !!rejected[myName];

    const btn = document.getElementById("buzzBtn");
    const status = document.getElementById("status");
    btn.classList.remove("win", "lost", "waiting");

    if (!open) {
        btn.disabled = true; btn.classList.add("waiting");
        status.textContent = "⏳ Warte auf die nächste Frage...";
    } else if (iAmRejected) {
        btn.disabled = true; btn.classList.add("lost");
        status.textContent = "❌ Falsch geraten – warte auf die nächste Runde.";
    } else if (winner === myName) {
        btn.disabled = true; btn.classList.add("win");
        status.textContent = "🎉 DU BIST DRAN! Sag die Antwort laut!";
    } else if (winner) {
        btn.disabled = true; btn.classList.add("lost");
        status.textContent = `⚡ ${winner} war schneller!`;
    } else {
        btn.disabled = false;
        status.textContent = "🔔 Bereit! Buzzere, sobald du die Antwort weißt.";
    }
}

onValue(buzzRef, (snap) => renderState(snap.val() || {}));

window.pressBuzz = async function () {
    if (!myName || !lastData.open) return;
    const rejected = lastData.rejected || {};
    if (rejected[myName]) return;
    if (navigator.vibrate) navigator.vibrate(60);
    document.getElementById("buzzBtn").disabled = true;
    try {
        await runTransaction(winnerRef, (current) => {
            if (current === null || current === undefined) return myName;
            return; // abort, jemand war schon schneller
        });
    } catch (e) { /* ignore */ }
};

initScreen();
</script>
</body>
</html>
